<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Figma Agent</title>
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; --accent: #7c3aed; --rec: #dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --card: #292524; --line: #44403c; --accent: #a78bfa; --rec: #f87171; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 140px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.hint { color: var(--muted); margin: 0 0 20px; }
    #log { display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border: none; }
    .tool { font-size: .85rem; color: var(--muted); }
    .error { color: var(--rec); }
    footer { position: fixed; inset: auto 0 0 0; background: var(--bg); border-top: 1px solid var(--line); padding: 14px 16px; }
    .bar { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
    #mic { flex: none; width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 1.6rem; cursor: pointer; }
    #mic.rec { background: var(--rec); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    #interim { flex: 1; color: var(--muted); min-height: 1.5em; }
    form { flex: 1; display: flex; gap: 8px; }
    input[type=text] { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    label { font-size: .85rem; color: var(--muted); white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1>Voice Figma Agent</h1>
    <p class="hint">Hold the mic (or press Space) and describe a workflow: "Create a FigJam flow for employee onboarding with HR, IT and manager swimlanes."</p>
    <div id="log"></div>
  </main>
  <footer>
    <div class="bar">
      <button id="mic" title="Hold to talk (Space)">🎤</button>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px; min-width:0">
        <div id="interim"></div>
        <form id="typed">
          <input type="text" id="text" placeholder="…or type a command" />
          <label><input type="checkbox" id="speak" checked /> Speak replies</label>
        </form>
      </div>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
